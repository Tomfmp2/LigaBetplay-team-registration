<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link href="./css/style.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <section id="registro-equipo">
                <img src="./assets/img/icons/liga-betplay-2020-seeklogo.png" alt="Logo de la liga BetPlay">
                <div id="datos-equipo">
                    <strong class="instruccion-dato">Ingresar Nombre</strong>
                    <input type="text" placeholder="Nombre del Equipo">
                    <br>
                    <strong class="instruccion-dato">Ingresar Logo</strong>
                    <input type="file" name="Logo Equipo">
                </div>
            </section>
            <section id="info-equipo">
                <div id="equipo"></div>
                <div id="escudo-equipo"></div>
            </section>
        </main>
        <footer>
             <p>Copyright &copy; 2025 TomDev. All Rights Reserved.</p>
        </footer>
        <script src="./js/app.js"></script>
    </body>
</html>
