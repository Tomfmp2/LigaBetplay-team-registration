<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link href="./css/style.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <section id="registro-equipo">
                <img id="logo-betplay" src="./assets/img/icons/liga-betplay-2020-seeklogo.png" alt="Logo de la liga BetPlay">
                <div id="datos-equipo">
                    <strong class="instruccion-dato">Ingresar Nombre</strong>
                    <input id="name-equipo" class="inputs" type="text" placeholder="Nombre del Equipo">
                    <br>
                    <strong class="instruccion-dato">Ingresar Logo</strong>
                    <input id="add-logo" class="inputs" type="file" name="Logo Equipo">
                    <div id="box-button-registrar">
                        <input id="button-registrar" type="button" value="Registrar Equipo">
                    </div>
                </div>
            </section>
            <section id="info-equipo">
                <h2 id="title-tabla">Informacion de los Equipos</h2>
                <div id="tabla-equipos">
                    <div id="equipo" class="info-tabla">
                        <h3>Equipos</h3>
                    </div>
                    <div id="escudo-equipo" class="info-tabla">
                        <h3>Escudos</h3>    
                    </div>
                </div>
            </section>
        </main>
        <footer>
             <p>Copyright &copy; 2025 TomDev. All Rights Reserved.</p>
        </footer>
        <script src="./js/app.js"></script>
    </body>
</html>
